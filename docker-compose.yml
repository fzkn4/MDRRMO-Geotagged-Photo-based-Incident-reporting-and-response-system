version: "3.8"

services:
  geotagged-app:
    build: .
    ports:
      - "8080:80"
    volumes:
      # Mount the current directory for development
      - .:/var/www/html
      # Mount users.json separately to persist user data
      - ./users.json:/var/www/html/users.json
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    restart: unless-stopped
    container_name: geotagged-incident-reporting

  # Optional: Add phpMyAdmin if you want to add database later
