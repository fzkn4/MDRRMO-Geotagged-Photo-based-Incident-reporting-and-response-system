services:
  geotagged-app:
    build: .
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      # Mount the current directory for development
      - .:/var/www/html
      # Mount users.json separately to persist user data
      - ./users.json:/var/www/html/users.json
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=geotagged
      - DB_USER=geotagged_user
      - DB_PASSWORD=geotagged_password
    restart: unless-stopped
    container_name: geotagged-incident-reporting
    depends_on:
      - db

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: geotagged
      MYSQL_USER: geotagged_user
      MYSQL_PASSWORD: geotagged_password
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
